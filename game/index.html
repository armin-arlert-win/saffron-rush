<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saffron Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17120c; }
  #game { position: fixed; inset: 0; margin: auto; width: min(100vw, 160vh); height: min(100vh, 62.5vw); display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #testout { position: absolute; left: 0; top: 0; color: #fff; font: 12px monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Saffron Rush: a fast kitchen game. Move with WASD or arrows, press E to grab, chop, grill, build and serve."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testout"></pre>
<script type="module" src="./src/main.js"></script>
</body>
</html>
